name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - run: bun run check
      - name: Build and test pinned core
        run: bun run build:core
      - name: Verify native observer
        run: python3 scripts/test-plugin.py bin/plugins/proxcli-usage.so
      - name: Verify panel contract with pinned core
        run: PROXCLI_TEST_CORE="$PWD/bin/cli-proxy-api" PROXCLI_TEST_PLUGIN="$PWD/bin/plugins/proxcli-usage.so" PROXCLI_TEST_POLICY=true go test ./internal/hub -run TestCLIProxyAPIIntegration -count=1 -v

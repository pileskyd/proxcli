name: Upstream compatibility
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-compatibility
  cancel-in-progress: false
jobs:
  latest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      newer: ${{ steps.release.outputs.newer }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - id: release
        name: Detect latest stable upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/upstream-release.mjs
  compatibility:
    needs: latest
    if: needs.latest.outputs.newer == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CGO_ENABLED: '1'
      UPSTREAM_VERSION: ${{ needs.latest.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Apply patch, test and build candidate core and observer
        run: bun run build:core --upstream "$UPSTREAM_VERSION"
      - name: Verify native observer
        run: python3 scripts/test-plugin.py bin/plugins/proxcli-usage.so
      - name: Verify panel contract with candidate core
        run: PROXCLI_TEST_CORE="$PWD/bin/cli-proxy-api" PROXCLI_TEST_PLUGIN="$PWD/bin/plugins/proxcli-usage.so" PROXCLI_TEST_POLICY=true go test ./internal/hub -run TestCLIProxyAPIIntegration -count=1 -v
      - name: Record compatibility result
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          printf 'Compatibility probe for **%s**: **%s**. See step logs for the resolved commit and failures. The upstream pin was not changed.\n' "$UPSTREAM_VERSION" "$RESULT" >> "$GITHUB_STEP_SUMMARY"
